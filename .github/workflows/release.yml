name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Validate and publish both products
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+, Node, and pnpm
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: 22.22.2
          cache: false
          run-install: false

      - name: Validate tag and fixed product version
        shell: bash
        run: |
          cli_version="$(node -p 'require("./packages/cli/package.json").version')"
          web_version="$(node -p 'require("./apps/web/package.json").version')"
          if [[ "$cli_version" != "$web_version" ]]; then
            echo "::error::CLI $cli_version and Web $web_version versions differ."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" != "v$cli_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must exactly equal v$cli_version."
            exit 1
          fi
          echo "RELEASE_VERSION=$cli_version" >> "$GITHUB_ENV"

      - name: Verify npm trusted-publishing identity
        shell: bash
        run: |
          test "$(npx --yes npm@12.0.2 --version)" = "12.0.2"
          test "$GITHUB_ACTIONS" = "true"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test "$GITHUB_REPOSITORY" = "Thisisjuke/skills-benchmark"
          case "$GITHUB_WORKFLOW_REF" in
            Thisisjuke/skills-benchmark/.github/workflows/release.yml@*) ;;
            *) echo "::error::Unexpected workflow identity: $GITHUB_WORKFLOW_REF"; exit 1 ;;
          esac

      - name: Check npm registry state
        id: registry
        shell: bash
        run: |
          any=false
          for entry in \
            "cli|@thisisjuke/skillbench" \
            "web|@thisisjuke/skillbench-web"
          do
            product="${entry%%|*}"
            package="${entry#*|}"
            set +e
            output="$(npx --yes npm@12.0.2 view "$package@$RELEASE_VERSION" version 2>&1)"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              if [[ "$output" != "$RELEASE_VERSION" ]]; then
                echo "::error::Registry returned unexpected $product version: $output"
                exit 1
              fi
              echo "$product=false" >> "$GITHUB_OUTPUT"
            elif grep -Fq "npm error code E404" <<< "$output"; then
              echo "$product=true" >> "$GITHUB_OUTPUT"
              any=true
            else
              printf '%s\n' "$output"
              exit "$status"
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.registry.outputs.any == 'true'
        run: vp install --frozen-lockfile

      - name: Build, type-check, and test workspace
        if: steps.registry.outputs.any == 'true'
        run: vp run check

      - name: Package and smoke-test release artifacts
        if: steps.registry.outputs.any == 'true'
        id: artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vp run smoke:release
          cli_path="$(node -p 'require("./artifacts/release-artifacts.json").artifacts.find(({ product }) => product === "cli").path')"
          web_path="$(node -p 'require("./artifacts/release-artifacts.json").artifacts.find(({ product }) => product === "web").path')"
          test -f "$cli_path"
          test -f "$web_path"
          echo "cli=$cli_path" >> "$GITHUB_OUTPUT"
          echo "web=$web_path" >> "$GITHUB_OUTPUT"

      - name: Publish CLI
        if: steps.registry.outputs.cli == 'true'
        run: npx --yes npm@12.0.2 publish "./${{ steps.artifacts.outputs.cli }}" --access public --provenance=false --loglevel verbose

      - name: Publish Web
        if: steps.registry.outputs.web == 'true'
        run: npx --yes npm@12.0.2 publish "./${{ steps.artifacts.outputs.web }}" --access public --provenance=false --loglevel verbose

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_path=".github/releases/$GITHUB_REF_NAME.md"
          test -s "$notes_path"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "Skillbench $GITHUB_REF_NAME" \
              --notes-file "$notes_path"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Skillbench $GITHUB_REF_NAME" \
              --notes-file "$notes_path"
          fi
