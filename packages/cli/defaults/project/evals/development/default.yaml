id: create-release-checklist
name: Create a release checklist
partition: development
prompt: |
  Create a Markdown file named RELEASE_CHECKLIST.md with a "Release checklist"
  heading and a checkbox reminding the reader to run the test suite.
assertions:
  - type: exit-code
    value: 0
  - type: file-exists
    value: RELEASE_CHECKLIST.md
  - type: contains
    path: RELEASE_CHECKLIST.md
    value: "# Release checklist"
  - type: contains
    path: RELEASE_CHECKLIST.md
    value: "- [ ] Run the test suite"
  - type: llm-rubric
    rubric: The checklist is concise, actionable, and easy to scan.
