# Copy the settings you need into .skillbench/config.yaml. Skillbench discovers that
# canonical path from the current directory or any of its descendants.
# The first entry is the default. Interactive commands can use it, select
# another complete profile, or append a newly configured runner.
runners:
  - type: codex
    executable: codex
    model: gpt-5.6-luna
    reasoningEffort: low
    sandbox: workspace-write
    maxOutputBytes: 1048576
  - type: opencode
    executable: opencode
    # model and variant are optional. When omitted, OpenCode uses its local defaults.
    sandbox: workspace-write
    maxOutputBytes: 1048576

eval:
  path: .skillbench/evals/development/default.yaml
  repeat: 3
  timeoutMs: 180000

comparison:
  tieThreshold: 0.01
  weights:
    functionalCorrectness: 0.40
    outputQuality: 0.20
    edgeCases: 0.15
    skillTriggering: 0.10
    instructionFollowing: 0.05
    tokenEfficiency: 0.05
    latency: 0.05

judge:
  blind: true
  reversePairwise: true

promptfoo:
  enabled: true

merge:
  candidates: 3
  requireImprovement: true
  minimumImprovement: 0

reports:
  markdown: true
  template: .skillbench/reports/comparison.md

outputs:
  # Interactive operations create unique bundles below this project-relative directory.
  directory: .skillbench/runs

sources:
  timeoutMs: 30000
  maxFileSizeBytes: 2097152
  maxSnapshotSizeBytes: 26214400
