id: project-output
name: Validate the fixture output
prompt: |
  Inspect the fixture project and preserve its deterministic output.
fixtures:
  - source: fixtures/project
    destination: .
assertions:
  - type: file-exists
    value: output.txt
  - type: contains
    path: output.txt
    value: deterministic
  - type: regex
    path: output.txt
    pattern: "^deterministic example\\n$"
  - type: command
    command: [pwd]
  - type: exit-code
    value: 0
  - type: promptfoo
    assertion:
      type: equals
      value: ""
